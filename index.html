    <!-- Tailwind CSS CDN (v3/v4 play) -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->

    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, blinkmacsystemfont, "Segoe UI", roboto, "Helvetica Neue", arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            --font-serif: "Playfair Display", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
        }

        @layer base {
            body {
                @apply bg-[#F9F8F6] text-[#1C1C1C] font-sans antialiased;
            }
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Modal Animation - Simple Fade/Slide */
        #activity-modal {
            transition: opacity 0.3s ease-out;
        }
        #activity-modal-content {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out;
        }
        #activity-modal.hidden {
            display: none;
            opacity: 0;
        }
        #activity-modal.flex {
            display: flex;
            opacity: 1;
        }
        #activity-modal.hidden #activity-modal-content {
            transform: translateX(100px) scale(0.95);
        }
        #activity-modal.flex #activity-modal-content {
            transform: translateX(0) scale(1);
        }

        /* Custom Scrollbar for hidden feel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(28, 28, 28, 0.1);
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(28, 28, 28, 0.2);
        }
    </style>
</head>

                    }
                ]
            },
            {
                id: "affinity",
                categoryId: "collaboration",
                category: "Collaboration & Problem Solving",
                jpCategory: "協働と課題解決",
                title: "Affinity Mapping",
                jpTitle: "親和図法/KJ法",
                description: "Grouping brainstormed ideas into categories to find patterns.",
                jpDescription: "ブレインストーミングしたアイデアをカテゴリーに分類し、パターンを見つけます。",
                steps: [
                    "Students independently write ideas on sticky notes (one idea per note).",
                    "Place all sticky notes randomly on a wall or whiteboard.",
                    "Without speaking, group members physically move notes into related clusters.",
                    "Once settled, the group discusses and writes a Header name for each cluster.",
                    "Analyze the patterns to draw conclusions about the main issue."
                ],
                roles: [
                    {
                        name: "Idea Generator",
                        jpName: "アイデア創出者",
                        phrases: [
                            "I'll write down...",
                            "Another idea that comes to mind is...",
                            "Let's brain-dump everything first."
                        ]
                    },
                    {
                        name: "Categorizer",
                        jpName: "分類者",
                        phrases: [
                            "These three notes belong together.",
                            "Let's name this category...",
                            "Does this note fit better here or there?"
                        ]
                    }
                ]
            },
            {
                id: "peer-review",
                categoryId: "presentation",
                category: "Presentation & Feedback",
                jpCategory: "発表とフィードバック",
                title: "Peer Review",
                jpTitle: "ピア・レビュー",
                description: "Students evaluate each other's work using a rubric and provide constructive feedback.",
                jpDescription: "ルーブリックを使用して互いの作品を評価し、建設的なフィードバックを提供します。",
                steps: [
                    "Students complete a draft assignment before or during the first half of class.",
                    "Distribute a clear grading rubric.",
                    "Students exchange work and silently evaluate using the rubric.",
                    "Reviewers write specific, actionable feedback (e.g., Two stars and a wish).",
                    "Partners discuss the feedback face-to-face."
                ],
                roles: [
                    {
                        name: "Reviewer",
                        jpName: "評価者",
                        phrases: [
                            "I really liked how you structured...",
                            "One area for improvement might be...",
                            "Have you considered adding a specific example here?"
                        ]
                    },
                    {
                        name: "Author",
                        jpName: "執筆者",
                        phrases: [
                            "Thank you for the constructive feedback.",
                            "What did you mean exactly when you said...?",
                            "I'll definitely revise that paragraph."
                        ]
                    }
                ]
            },
            {
                id: "mini-presentation",
                categoryId: "presentation",
                category: "Presentation & Feedback",
                jpCategory: "発表とフィードバック",
                title: "Mini-Presentation",
                jpTitle: "ミニプレゼンテーション",
                description: "Short, focused presentations to share findings or pitch ideas.",
                jpDescription: "発見を共有したりアイデアを売り込んだりするための、短く焦点を絞ったプレゼンテーション。",
                steps: [
                    "Assign groups a topic to synthesize into a pitch.",
                    "Set strict parameters (e.g., exactly 3 minutes, max 3 slides).",
                    "Groups finalize their talking points and practice.",
                    "Deliver presentations to the class.",
                    "Host a brief Q&A session after each pitch."
                ],
                roles: [
                    {
                        name: "Presenter",
                        jpName: "発表者",
                        phrases: [
                            "The main problem our project solves is...",
                            "As you can see on this slide...",
                            "To conclude, we firmly believe that..."
                        ]
                    },
                    {
                        name: "Audience",
                        jpName: "聴衆",
                        phrases: [
                            "Could you elaborate on this part?",
                            "Who do you consider your main target audience?",
                            "I loved the presentation, but I'm curious about..."
                        ]
                    }
                ]
            },
            {
                id: "debate",
                categoryId: "presentation",
                category: "Presentation & Feedback",
                jpCategory: "発表とフィードバック",
                title: "Debate",
                jpTitle: "ディベート",
                description: "Formal argumentation on a controversial topic using evidence.",
                jpDescription: "証拠を用いた、議論を呼ぶテーマに関する正式な議論。",
                steps: [
                    "Present a debatable resolution and assign Affirmative and Negative sides.",
                    "Give teams time to compile evidence from pre-class readings.",
                    "Teams deliver opening constructive speeches.",
                    "Conduct cross-examination where sides ask each other direct questions.",
                    "Deliver closing rebuttals and have the class vote on the winner."
                ],
                roles: [
                    {
                        name: "Affirmative",
                        jpName: "正方",
                        phrases: [
                            "We strongly advocate that...",
                            "The primary benefit of this is...",
                            "To counter my opponent's argument..."
                        ]
                    },
                    {
                        name: "Negative",
                        jpName: "反方",
                        phrases: [
                            "On the contrary, this would lead to...",
                            "The fatal flaw in that logic is...",
                            "While that sounds ideal, realistically..."
                        ]
                    }
                ]
            },
            {
                id: "gallery-walk",
                categoryId: "presentation",
                category: "Presentation & Feedback",
                jpCategory: "発表とフィードバック",
                title: "Gallery Walk",
                jpTitle: "ギャラリーウォーク",
                description: "Students walk around the room to view, discuss, and leave feedback on peers' displayed work.",
                jpDescription: "部屋を歩き回り、展示された仲間の作品を見て議論し、フィードバックを残します。",
                steps: [
                    "Groups display their completed work (posters, charts) around the room.",
                    "One member stays with the poster as the Exhibitor to explain it.",
                    "Other members (Visitors) rotate around the room to examine other works.",
                    "Visitors ask questions and leave feedback via sticky notes.",
                    "Groups reconvene to review the feedback left on their poster."
                ],
                roles: [
                    {
                        name: "Exhibitor",
                        jpName: "展示者",
                        phrases: [
                            "Welcome to our exhibit. Our focus is...",
                            "Let me walk you through this section.",
                            "Do you have any questions about our work?"
                        ]
                    },
                    {
                        name: "Visitor",
                        jpName: "見学者",
                        phrases: [
                            "I find this part particularly insightful.",
                            "How did your group decide on this format?",
                            "I'm going to leave a comment here about..."
                        ]
                    }
                ]
            },
            {
                id: "four-corners",
                categoryId: "presentation",
                category: "Presentation & Feedback",
                jpCategory: "発表とフィードバック",
                title: "Four Corners",
                jpTitle: "フォーコーナーズ",
                description: "Students choose a corner representing their stance on an issue and debate with other corners.",
                jpDescription: "学生は問題に対する自分の立場を表すコーナーを選び、他のコーナーと議論します。",
                steps: [
                    "Label the 4 corners of the room: Strongly Agree, Agree, Disagree, Strongly Disagree.",
                    "Read a controversial statement related to the lesson.",
                    "Students physically move to the corner that matches their opinion.",
                    "Students in each corner confer to build their strongest arguments.",
                    "A representative from each corner debates the other corners."
                ],
                roles: [
                    {
                        name: "Advocate",
                        jpName: "擁護者",
                        phrases: [
                            "We chose this corner because...",
                            "The strongest evidence for our position is...",
                            "We stand firm on the belief that..."
                        ]
                    },
                    {
                        name: "Challenger",
                        jpName: "挑戦者",
                        phrases: [
                            "How do you respond to the fact that...?",
                            "Isn't it also true that...?",
                            "Your argument doesn't seem to account for..."
                        ]
                    }
                ]
            }
        ];

        // State
        let selectedCategory = null;
        let searchQuery = '';
        let showFavorites = false;
        let favorites = [];

        try {
            const saved = localStorage.getItem('adg_favorites');
            if (saved) favorites = JSON.parse(saved);
        } catch (e) {
            favorites = [];
        }

        // DOM Elements
        const sidebarNav = document.getElementById('sidebar-nav');
        const viewLabel = document.getElementById('view-label');
        const viewTitle = document.getElementById('view-title');
        const searchInput = document.getElementById('search-input');
        const activitiesGrid = document.getElementById('activities-grid');
        const modal = document.getElementById('activity-modal');
        const modalContent = document.getElementById('activity-modal-content');
        const modalBackdrop = document.getElementById('modal-backdrop');

        // Render Functions
        function renderNav() {
            let html = `
                <button onclick="setCategory(null, false)" class="${!selectedCategory && !showFavorites ? 'text-[#1C1C1C] border-b border-[#1C1C1C] pb-1 w-max' : 'text-[#8C8279] hover:text-[#1C1C1C]'} text-[11px] uppercase tracking-widest font-bold text-left transition-colors flex items-center">
                    <span>List of Methods</span>
                </button>
                <button onclick="setCategory(null, true)" class="${showFavorites ? 'text-[#1C1C1C] border-b border-[#1C1C1C] pb-1 w-max' : 'text-[#8C8279] hover:text-[#1C1C1C]'} text-[11px] uppercase tracking-widest font-bold text-left transition-colors flex items-center gap-2">
                    <i data-lucide="heart" class="w-3.5 h-3.5 ${showFavorites ? 'fill-[#1C1C1C]' : ''}"></i>
                    <span>Favorites</span>
                </button>
                <div class="mt-4">
                    <div class="flex flex-col gap-5">
            `;

            categories.forEach(cat => {
                const isActive = selectedCategory === cat.id && !showFavorites;
                html += `
                    <button onclick="setCategory('${cat.id}', false)" class="${isActive ? 'text-[#1C1C1C]' : 'text-[#8C8279] hover:text-[#1C1C1C]'} group flex text-left transition-colors">
                        <span class="text-[11px] uppercase tracking-widest font-bold ${isActive ? 'border-b border-[#1C1C1C] pb-0.5 w-max' : ''}">
                            ${cat.name}
                        </span>
                    </button>
                `;
            });

            html += `</div></div>`;
            sidebarNav.innerHTML = html;
            lucide.createIcons();
        }

        function renderHeader() {
            if (showFavorites) {
                viewLabel.textContent = 'Your Collection';
                viewTitle.textContent = 'Favorites';
            } else if (selectedCategory) {
                viewLabel.textContent = 'Selected Section';
                const cat = categories.find(c => c.id === selectedCategory);
                viewTitle.textContent = cat ? cat.name : 'All Activities';
            } else {
                viewLabel.textContent = 'Overview';
                viewTitle.textContent = 'All Activities';
            }
        }

        function renderActivities() {
            const filtered = activities.filter(a => {
                if (showFavorites && !favorites.includes(a.id)) return false;
                if (!showFavorites && selectedCategory && a.categoryId !== selectedCategory) return false;
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    return a.title.toLowerCase().includes(q) 
                      || a.description.toLowerCase().includes(q)
                      || a.jpTitle.includes(q);
                }
                return true;
            });

            activitiesGrid.innerHTML = filtered.map((a, idx) => `
                <div class="group relative cursor-pointer bg-white/40 border border-[#1C1C1C]/10 p-8 flex flex-col transition-all duration-300 hover:bg-white/80 hover:shadow-sm" onclick="openModal('${a.id}')">
                    <div class="absolute top-6 right-6 z-10">
                        <button onclick="event.stopPropagation(); toggleFav('${a.id}')" class="p-2 rounded-full transition-colors ${favorites.includes(a.id) ? 'text-[#1C1C1C]' : 'text-[#8C8279] hover:text-[#1C1C1C]'}">
                            <i data-lucide="heart" class="w-5 h-5 ${favorites.includes(a.id) ? 'fill-[#1C1C1C]' : ''}"></i>
                        </button>
                    </div>
                    <h3 class="text-xl lg:text-2xl font-serif leading-tight text-[#2D2926] mb-2 pr-10">${a.title}</h3>
                    <p class="text-sm text-[#8C8279] mb-6 font-serif italic">${a.jpTitle}</p>
                    <p class="text-sm text-[#5E5852] leading-relaxed line-clamp-3 mt-auto">
                        ${a.description}
                    </p>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        // Actions
        window.setCategory = (id, fav) => {
            selectedCategory = id;
            showFavorites = fav;
            renderNav();
            renderHeader();
            renderActivities();
        };

        window.toggleFav = (id) => {
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('adg_favorites', JSON.stringify(favorites));
            renderActivities();
            renderNav();
            // If we are in modal, re-render it too
            if (!modal.classList.contains('hidden')) {
                const currentId = modal.dataset.currentId;
                if (currentId) renderModalContent(currentId);
            }
        };

        window.openModal = (id) => {
            modal.dataset.currentId = id;
            renderModalContent(id);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        };

        function renderModalContent(id) {
            const a = activities.find(act => act.id === id);
            if (!a) return;

            const isFav = favorites.includes(a.id);

            modalContent.innerHTML = `
                <div class="sticky top-0 bg-[#F9F8F6]/90 backdrop-blur-md border-b border-[#1C1C1C]/10 px-8 lg:px-12 py-6 flex items-center justify-between z-10">
                    <span class="text-[10px] uppercase tracking-[0.3em] font-semibold text-[#8C8279]">Activity Details</span>
                    <div class="flex items-center gap-6">
                        <button onclick="toggleFav('${a.id}')" class="transition-colors flex items-center gap-2 text-[10px] uppercase tracking-widest font-bold ${isFav ? 'text-[#1C1C1C]' : 'text-[#8C8279] hover:text-[#1C1C1C]'}">
                            <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-[#1C1C1C]' : ''}"></i>
                            <span class="hidden sm:inline">${isFav ? 'Saved' : 'Save'}</span>
                        </button>
                        <div class="w-[1px] h-4 bg-[#1C1C1C]/10"></div>
                        <button onclick="closeModal()" class="text-[#8C8279] hover:text-[#1C1C1C] transition-colors">
                            <i data-lucide="x" class="w-6 h-6 stroke-[1.5]"></i>
                        </button>
                    </div>
                </div>

                <div class="p-8 lg:p-16 flex flex-col gap-10">
                    <section class="flex flex-col">
                        <div class="mb-10">
                            <h2 class="text-4xl md:text-6xl font-serif leading-[0.9] mb-4 text-[#1C1C1C]">${a.title}</h2>
                            <p class="text-lg text-[#8C8279] font-serif italic leading-snug">
                                ${a.jpTitle}
                            </p>
                        </div>
                        
                        <div class="p-6 md:p-8 border border-[#1C1C1C]/10 bg-white/40">
                            <p class="text-xl md:text-2xl font-serif text-[#2D2926] leading-snug mb-4">${a.description}</p>
                            <p class="text-sm text-[#5E5852]">${a.jpDescription}</p>
                        </div>
                    </section>

                    <section>
                        <h4 class="text-[10px] uppercase tracking-[0.2em] font-black text-[#1C1C1C] border-b border-[#1C1C1C] pb-2 mb-8">
                            Implementation Steps
                        </h4>
                        <div class="flex flex-col gap-6">
                            ${a.steps.map((step, idx) => `
                                <div class="group">
                                    <div class="text-[11px] font-bold tracking-tighter mb-2 flex items-center gap-2 text-[#1C1C1C]">
                                        <span class="w-6 h-[1px] bg-[#1C1C1C]"></span>
                                        STEP ${idx + 1}
                                    </div>
                                    <p class="text-sm text-[#5E5852] leading-snug">
                                        ${step}
                                    </p>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <section>
                        <h4 class="text-[10px] uppercase tracking-[0.2em] font-black text-[#1C1C1C] border-b border-[#1C1C1C] pb-2 mb-8">
                            Phrasing Guide for Selected Roles
                        </h4>
                        
                        <div class="flex flex-col gap-8">
                            ${a.roles.map((role, idx) => `
                                <div class="flex flex-col md:flex-row gap-4 md:gap-8 items-start">
                                    <div class="w-full md:w-32 flex-shrink-0">
                                        <span class="text-xs font-bold uppercase tracking-widest text-[#A67C52] block mb-1">${role.name}</span>
                                        <span class="text-[11px] uppercase tracking-wider text-[#8C8279]">${role.jpName}</span>
                                    </div>
                                    <div class="flex-1 md:border-l border-[#1C1C1C]/10 md:pl-8 space-y-3">
                                        ${role.phrases.map((phrase, pIdx) => `
                                            <p class="text-sm text-[#5E5852] leading-snug">
                                                "${phrase}"
                                            </p>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                </div>
            `;
            lucide.createIcons();
        }

        // Events
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderActivities();
        });

        modalBackdrop.addEventListener('click', closeModal);

        // Init
        renderNav();
        renderHeader();
        renderActivities();
        lucide.createIcons();
    </script>
</body>
</html>
